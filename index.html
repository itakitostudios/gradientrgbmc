<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generador de degradados &#RRGGBB</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    background: #111;
    color: #eee;
    max-width: 760px;
    margin: 40px auto;
    padding: 0 20px;
  }
  h1 { font-size: 22px; }
  .row { display: flex; gap: 12px; align-items: center; margin: 12px 0; flex-wrap: wrap; }
  input[type=text] {
    flex: 1; padding: 10px; border-radius: 8px;
    border: 1px solid #333; background: #1c1c1c; color: #eee; font-size: 16px;
  }
  input[type=color] { width: 60px; height: 40px; border: none; background: none; cursor: pointer; }
  .preview {
    background: #000; border-radius: 10px; padding: 30px;
    text-align: center; font-size: 40px; font-family: 'Courier New', monospace;
    margin: 20px 0; white-space: pre-wrap; word-break: break-all;
  }
  .output {
    background: #1c1c1c; border: 1px solid #333; border-radius: 8px;
    padding: 12px; font-family: monospace; font-size: 14px;
    word-break: break-all; white-space: pre-wrap;
  }
  button {
    margin-top: 10px; padding: 10px 18px; border: none; border-radius: 8px;
    background: #7c3aed; color: white; font-weight: bold; cursor: pointer;
  }
  button:hover { background: #6d28d9; }
  label { font-size: 14px; color: #aaa; }
</style>
</head>
<body>

<h1>Generador de degradados (&#RRGGBB)</h1>

<div class="row">
  <label>Texto:</label>
  <input type="text" id="texto" value="POINTSHOP">
</div>

<div class="row">
  <label>Color 1:</label>
  <input type="color" id="c1" value="#c084fc">
  <label>Color 2:</label>
  <input type="color" id="c2" value="#818cf8">
  <label><input type="checkbox" id="negrita" checked> Negrita (&amp;l)</label>
</div>

<div class="preview" id="preview"></div>

<label>Código para pegar en el plugin:</label>
<div class="output" id="codigo"></div>
<button onclick="copiar()">Copiar código</button>

<script>
  const $ = id => document.getElementById(id);

  const hex2 = n => Math.round(n).toString(16).padStart(2, '0').toUpperCase();
  const rgb = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16));

  function generar() {
    const texto = $('texto').value || 'TEXTO';
    const [r1, g1, b1] = rgb($('c1').value);
    const [r2, g2, b2] = rgb($('c2').value);
    const negrita = $('negrita').checked;

    const chars = [...texto];
    const total = chars.filter(c => c !== ' ').length;
    let idx = 0;
    let codigo = '';
    let html = '';

    for (const ch of chars) {
      if (ch === ' ') {
        codigo += ' ';
        html += ' ';
        continue;
      }
      const t = total <= 1 ? 0 : idx / (total - 1);
      const r = r1 + (r2 - r1) * t;
      const g = g1 + (g2 - g1) * t;
      const b = b1 + (b2 - b1) * t;
      const hex = '#' + hex2(r) + hex2(g) + hex2(b);

      codigo += '&#' + hex.slice(1) + (negrita ? '&l' : '') + ch;
      html += `<span style="color:${hex};font-weight:${negrita ? 900 : 400}">${ch}</span>`;
      idx++;
    }

    $('preview').innerHTML = html;
    $('codigo').textContent = codigo;
  }

  function copiar() {
    navigator.clipboard.writeText($('codigo').textContent);
  }

  ['texto', 'c1', 'c2', 'negrita'].forEach(id => $(id).addEventListener('input', generar));
  generar();
</script>

</body>
</html>
